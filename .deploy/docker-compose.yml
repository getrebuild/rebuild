# ${VAR:-默认值} 可由同目录 .env 或 shell 环境变量覆盖，不设置时行为与之前一致
# RB_DB_PASSWD 仅首次安装 (数据卷为空) 时生效，之后以卷内 .rebuild 文件为准，改密码需 down -v 重来
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: '${RB_DB_PASSWD:-rebuild!P4wd}'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h mysql -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app_network

  rebuild:
    image: ${RB_IMAGE:-getrebuild/rebuild:latest}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - >
        mkdir -p /app/rebuild/.rebuild &&
        java -Dinitialize=docker -Duser.timezone=Asia/Shanghai -DSN=${RB_SN:-} -DDataDirectory=/app/rebuild/.rebuild -jar /app/rebuild/rebuild-boot.jar
    environment:
      RB_DB_PASSWD: '${RB_DB_PASSWD:-rebuild!P4wd}'
    ports:
      - '${RB_HTTP_PORT:-18080}:18080'
    volumes:
      - rebuild_data:/app/rebuild/.rebuild
    restart: unless-stopped
    networks:
      - app_network

volumes:
  mysql_data:
  rebuild_data:

networks:
  app_network:
    driver: bridge
