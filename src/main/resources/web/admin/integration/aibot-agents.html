<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <meta name="page-help" content="https://getrebuild.com/docs/admin/integration-aibot#%E6%99%BA%E8%83%BD%E4%BD%93" />
    <title>智能体</title>
    <style>
      .agent-icon-tile {
        flex: none;
        width: 72px;
        height: 72px;
        margin: 0 auto 8px;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(254, 82, 129, 0.14), rgba(71, 78, 254, 0.14));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .agent-icon-tile .icon {
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <div class="rb-wrapper rb-fixed-sidebar rb-collapsible-sidebar rb-collapsible-sidebar-hide-logo rb-color-header" th:classappend="${sideCollapsedClazz}">
      <th:block th:replace="~{/_include/nav-top}" />
      <th:block th:replace="~{/_include/nav-left-admin(active='aibot-agents')}" />
      <div class="rb-content">
        <div class="main-content container-fluid syscfg">
          <div style="width: 680px; margin: 200px auto; text-align: center">
            <div class="agent-icon-tile"><i class="icon mdi mdi-shimmer ai-color"></i></div>
            <p class="text-muted fs-14">智能体可为不同业务场景创建专属智能体，分别配置各自的模型、提示词、知识库与工具，例如客服专用的问答智能体、销售专用的数据统计智能体。</p>
            <p class="text-muted fs-14">该功能即将开放，敬请期待。</p>
          </div>
        </div>
      </div>
    </div>
    <th:block th:replace="~{/_include/footer}" />
  </body>
</html>
