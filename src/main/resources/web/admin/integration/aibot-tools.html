<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <meta name="page-help" content="https://getrebuild.com/docs/admin/integration-aibot" />
    <title>Rex AI [[${bundle.L('工具')}]]</title>
  </head>
  <body>
    <div class="rb-wrapper rb-fixed-sidebar rb-collapsible-sidebar rb-collapsible-sidebar-hide-logo rb-color-header" th:classappend="${sideCollapsedClazz}">
      <th:block th:replace="~{/_include/nav-top}" />
      <th:block th:replace="~{/_include/nav-left-admin(active='aibot-tools')}" />
      <div class="rb-content">
        <div class="main-content container-fluid syscfg">
          <div class="row">
            <div class="col-lg-9 col-12">
              <div class="card">
                <div class="card-header pb-1">
                  [[${bundle.L('工具')}]]
                  <a href="https://getrebuild.com/market/go/aitool" target="_blank" class="float-right"><i class="icon zmdi zmdi-plus"></i> [[${bundle.L('添加')}]]</a>
                </div>
                <div class="card-body card-body-loading">
                  <table class="table table-hover">
                    <thead>
                      <tr>
                        <th width="40%">[[${bundle.L('名称')}]]</th>
                        <th>[[${bundle.L('描述')}]]</th>
                        <th width="80"></th>
                      </tr>
                    </thead>
                    <tbody id="toolsList"></tbody>
                  </table>

                  <div class="spinner"></div>
                  <div class="list-nodata hide">
                    <span class="mdi mdi-wrench-outline"></span>
                    <p>[[${bundle.L('暂无工具')}]]</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-3 col-12 col-right-compact">
              <div class="card">
                <div class="card-header pb-1">[[${bundle.L('MCP 接入')}]]</div>
                <div class="card-body">
                  <p class="mb-1">[[${bundle.L('通过 MCP 接入，可以在 WorkBuddy、QoderWork 等支持 MCP 协议的 AI 客户端中直接调用 Rex AI 助手。')}]]</p>
                  <p>[[${bundle.L('注意“个人密钥”需替换成自己的，切勿共享。')}]]</p>
                  <div class="J_mcpConfig" th:data-url="${_McpServerUrl}"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <th:block th:replace="~{/_include/footer}" />
    <script th:src="@{/assets/js/admin/config-comps.js}" type="text/babel"></script>
    <script th:src="@{/assets/js/admin/aibot-kits.js}" type="text/babel"></script>
  </body>
</html>
