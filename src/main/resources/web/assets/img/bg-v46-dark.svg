      <rect x="-27" y="-27" width="54" height="54" rx="13" fill="url(#ddTile)" stroke="#6f9dff" stroke-opacity="0.22"/>
      <path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#8fb6ff" stroke-opacity="0.3" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </g>

  <g stroke="#6f9dff" stroke-opacity="0.34" stroke-width="1.2">
    <path d="M128 168 L128 192 M116 180 L140 180"/>
    <path d="M1812 552 L1812 576 M1800 564 L1824 564"/>
    <path d="M116 918 L116 942 M104 930 L128 930"/>
    <path d="M1452 452 L1452 466 M1445 459 L1459 459"/>
  </g>

  <g fill="#8fd8ff">
    <circle cx="1380" cy="650" r="2.4" fill-opacity="0.4"/>
    <circle cx="560" cy="600" r="1.8" fill-opacity="0.3"/>
    <circle cx="1200" cy="930" r="2.2" fill-opacity="0.36"/>
    <circle cx="760" cy="980" r="1.6" fill-opacity="0.26"/>
    <circle cx="1240" cy="220" r="1.8" fill-opacity="0.3"/>
