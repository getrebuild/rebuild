    <path d="M0 626 H1920"/>
    <path d="M0 660 H1920"/>
    <path d="M0 704 H1920"/>
    <path d="M0 758 H1920"/>
    <path d="M0 824 H1920"/>
    <path d="M0 904 H1920"/>
    <path d="M0 1000 H1920"/>
  </g>

  <ellipse cx="1684" cy="824" rx="340" ry="300" fill="url(#ddHalo)"/>

  <g transform="translate(1684 824) rotate(-12)" filter="url(#ddShadow)">
    <rect x="-162" y="-162" width="324" height="324" rx="70" fill="url(#ddMark)" stroke="#6f9dff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M-88 -88 L88 88 M88 -88 L-88 88" fill="none" stroke="#8fb6ff" stroke-opacity="0.34" stroke-width="19" stroke-linecap="round"/>
  </g>

  <g filter="url(#ddGlow)">
    <g transform="translate(252 318) rotate(-10)" fill="none">
      <rect x="-64" y="-64" width="128" height="128" rx="28" fill="url(#ddTile)" stroke="#6f9dff" stroke-opacity="0.26"/>
      <path d="M-34 -34 L34 34 M34 -34 L-34 34" stroke="#8fb6ff" stroke-opacity="0.34" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(1652 296) rotate(12)" fill="none">
      <rect x="-48" y="-48" width="96" height="96" rx="22" fill="url(#ddTile)" stroke="#6f9dff" stroke-opacity="0.24"/>
