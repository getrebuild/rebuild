    </g>
    <g transform="translate(1508 132) rotate(-6)" fill="none">
      <rect x="-25" y="-25" width="50" height="50" rx="12" fill="url(#ddTile)" stroke="#6f9dff" stroke-opacity="0.2"/>
      <path d="M-13 -13 L13 13 M13 -13 L-13 13" stroke="#8fb6ff" stroke-opacity="0.28" stroke-width="3.4" stroke-linecap="round"/>
    </g>
