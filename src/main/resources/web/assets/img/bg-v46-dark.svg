<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Rex 深色登录页底图 - 网格与标记">
  <defs>
    <linearGradient id="ddBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="0.5" stop-color="#0b1527"/>
      <stop offset="1" stop-color="#0e1d34"/>
    </linearGradient>
    <radialGradient id="ddGlow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#2f6bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ddGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8bf5" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#4c8bf5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4c8bf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ddGlow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22a7d8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22a7d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ddHorizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#2f6bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ddHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ddGrid" x1="0" y1="560" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f9dff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#6f9dff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6f9dff" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="ddTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ddMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="ddShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="ddGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2f6bff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="ddFloor">
      <rect x="0" y="560" width="1920" height="520"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#ddBg)"/>
