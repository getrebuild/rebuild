<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <title>[[${title ?:'REBUILD'}]]</title>
    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        background-color: #fff;
      }
      .EasyMDEContainer .CodeMirror .cm-formatting {
        display: inline !important;
      }
      .markdown-body {
        padding: 10px 15px;
      }
    </style>
  </head>
  <body>
    <div id="viewer" style="width: 100%; height: 100%" th:data-fileid="${fileid}">
      <textarea id="editor" class="hide">[[${content}]]</textarea>
    </div>
    <input type="file" id="_fieldValue__upload" accept="image/*" class="hide" />

    <th:block th:replace="~{/_include/footer}" />
    <script th:src="@{/assets/js/md-preview.js}" type="text/babel"></script>
  </body>
</html>
