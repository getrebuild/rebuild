<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <meta name="viewport" content="minimal-ui,width=device-width,initial-scale=1,minimum-scale=1,maximum-size=1,user-scalable=no" />
    <title>[[${subject ?: bundle.L('AI 会话分享')}]]</title>
    <style>
      html {
        font-size: 14px;
      }
      body {
        min-height: auto;
        padding-bottom: 60px;
      }
      .shared-aibot-chat {
        max-width: 982px;
        margin-left: auto;
        margin-right: auto;
      }
      .shared-aibot-chat h1 {
        font-size: 1.5rem;
        margin-top: 20px;
        margin-bottom: 16px;
      }
      .shared-aibot-chat .chat-messages {
        height: auto;
        border-radius: 8px;
      }
      @media (max-width: 800px) {
        .shared-aibot-chat {
          width: 100%;
        }
        .shared-aibot-chat h1 {
          margin: 20px 16px;
        }
        .shared-aibot-chat .chat-messages {
          border-radius: 0;
          padding: 20px 16px;
        }
        .rb-scroll-top.show {
          right: 16px;
        }
      }
      .chat-input .chat-input-attach > span,
      .chat-message .msg-user > .msg-attach > a {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <img src="https://getrebuild.com/img/logo256.png" alt="Logo for Thumb" style="display: none" />
    <div class="shared-aibot-chat">
      <h1 class="text-bold">
        [[${subject}]]
        <div class="chat-meta">
          <small class="text-muted fs-12">
            <i class="icon mdi mdi-information-outline"></i>
            [[${bundle.L('内容由 AI 生成')}]]
          </small>
          <small th:if="${shareByName != null}" class="text-muted fs-12"><b> · </b>[[${bundle.L('由 %s 分享', shareByName)}]]</small>
        </div>
      </h1>
      <div class="rb-loading rb-loading-active must-center J_load-page">
        <th:block th:replace="~{/_include/spinner}" />
      </div>
      <div class="chat-messages J_content hide"></div>
    </div>

    <div th:if="${pageFooter != null}" class="page-footer">
      <a class="ai-color link" href="https://getrebuild.com/market/go/aibot?s=shared-aibot-chat" target="_blank">[(${pageFooter})]</a>
    </div>
    <div class="rb-scroll-top"></div>
    <th:block th:replace="~{/_include/footer}" />
    <script>
      window.__PageConfig = {
        messages: [(${messages ?:'null'})],
      }
    </script>
    <script th:src="@{/assets/js/shared-aibot-chat.js}" type="text/babel"></script>
  </body>
</html>
