<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" dark2="auto" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/theme-dark2-base.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/theme-dark2.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/chat-view.css}" />
    <meta name="viewport" content="minimal-ui,width=device-width,initial-scale=1,minimum-scale=1,maximum-size=1,user-scalable=no" />
    <title>[[${subject ?: bundle.L('AI 会话分享')}]]</title>
    <style>
      html {
        font-size: 14px;
      }
      body {
        min-height: auto;
        padding-bottom: 60px;
      }
      .shared-aibot-chat {
        max-width: 982px;
        margin-left: auto;
        margin-right: auto;
      }
      .shared-aibot-chat .chat-subject {
        margin: 20px 0;
        margin-bottom: 16px;
      }
      .shared-aibot-chat .chat-subject h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.4;
        margin-bottom: 5px;
      }
      .shared-aibot-chat .chat-messages {
        height: auto;
        border-radius: 8px;
        padding: 25px;
      }
      .shared-aibot-chat .chat-messages .chat-message {
        margin-bottom: 25px;
      }
      .shared-aibot-chat .chat-message .msg-user > .msg-attach > a {
        cursor: default;
      }
      @media (max-width: 800px) {
        html {
          font-size: 15px;
        }
        .shared-aibot-chat {
          width: 100%;
        }
        .shared-aibot-chat .chat-subject {
          margin-left: 16px;
          margin-right: 16px;
        }
        .shared-aibot-chat .chat-messages {
          padding: 20px 16px;
          border-radius: 0;
        }
        .rb-scroll-top.show {
          right: 16px;
        }
      }

      html.theme-dark2 body {
        background-color: #151b23;
      }
      html.theme-dark2 .chat-messages {
        background-color: rgba(13, 17, 23, 0.6);
      }
    </style>
  </head>
  <body>
    <img src="https://getrebuild.com/img/logo256.png" alt="Logo for Thumb" style="display: none" />
    <div class="shared-aibot-chat">
      <div class="chat-subject">
        <h1 class="text-bold">[[${subject}]]</h1>
        <div class="text-muted fs-md">
          <i class="icon mdi mdi-information-outline"></i>
          [[${bundle.L('内容由 AI 生成')}]]
          <span th:if="${shareByName != null}"><b> · </b>[[${bundle.L('由 %s 分享', shareByName)}]]</span>
        </div>
      </div>

      <div class="must-center spinner-loading">
        <div class="spinner"></div>
      </div>
      <div class="chat-messages J_content hide"></div>
    </div>

    <div th:if="${pageFooter != null}" class="page-footer">
      <a class="ai-color link" href="https://getrebuild.com/market/go/aibot?s=shared-aibot-chat" target="_blank">[(${pageFooter})]</a>
    </div>
    <div class="rb-scroll-top"></div>
    <th:block th:replace="~{/_include/footer}" />
    <script>
      window.__PageConfig = {
        messages: [(${messages ?:'null'})],
      }
    </script>
    <script th:src="@{/assets/js/shared-aibot-chat.js}" type="text/babel"></script>
  </body>
</html>
