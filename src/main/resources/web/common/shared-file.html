<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/theme-dark2-base.css}" />
    <meta name="viewport" content="minimal-ui,width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <meta http-equiv="refresh" content="3600" />
    <meta name="og:image" content="https://getrebuild.com/img/logo256.png" />
    <title>[[${title ?:bundle.L('分享文件')}]]</title>
    <style>
      .preview-modal {
        background-color: transparent;
        z-index: 10;
      }
      .preview-modal .preview-header {
        background-color: #28a745;
      }
      @media (max-width: 767.98px) {
        .unsupports {
          margin-left: 12px !important;
          margin-right: 12px !important;
        }
      }
      html.theme-dark2 .preview-modal .preview-header {
        background-color: var(--rb-dark-panel);
        border-bottom: 1px solid var(--rb-dark-border);
      }
      html.theme-dark2 .preview-modal .preview-body .iframe {
        background: var(--rb-dark-bg);
      }
    </style>
  </head>
  <body>
    <img src="https://getrebuild.com/img/logo256.png" alt="Logo for Thumb" style="display: none" />
    <div class="sharebox must-center">
      <div class="spinner"></div>
    </div>
    <div th:if="${pageFooter != null}" class="page-footer">[(${pageFooter})]</div>
    <th:block th:replace="~{/_include/footer}" />
    <script>
      window.__PageConfig = {
        publicUrl: '[[${publicUrl}]]'.replace('&amp;', '&'),
        shareByName: '[[${shareByName}]]',
      }
    </script>
    <script type="text/babel">
      $(document).ready(() => {
        renderRbcomp(<RbPreview urls={[window.__PageConfig.publicUrl]} shareBy={window.__PageConfig.shareByName} unclose fullwidth csrfToken={rb.csrfToken} />)
      })
    </script>
  </body>
</html>
