<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{/_include/header}" />
    <meta name="og:image" content="https://getrebuild.com/img/logo256.png" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/login.css}" />
    <th:block th:if="${param.frame != null && param.frame[0] == '1'}">
      <link rel="stylesheet" type="text/css" th:href="@{/assets/css/theme-dark2-base.css}" />
      <link rel="stylesheet" type="text/css" th:href="@{/assets/css/theme-dark2.css}" />
    </th:block>
    <title>[[${bundle.L('用户登录')}]]</title>
    <script>
      if (navigator.userAgent.indexOf('MSIE') > -1 || navigator.userAgent.indexOf('Trident') > -1) {
        location.href = '../error/unsupported-browser'
      }
    </script>
  </head>
  <body class="rb-splash-screen">
    <img src="https://getrebuild.com/img/logo256.png" alt="Logo for Thumb" style="display: none" />
    <div class="rb-wrapper rb-login">
      <div class="rb-bgimg"></div>
      <div class="rb-content" style="z-index: 2">
        <div class="announcement-wrapper">
          <div class="bg-danger" th:if="${UsersMsg != null}">
            <i class="icon zmdi zmdi-alert-octagon"></i>
            <p th:utext="${UsersMsg}"></p>
          </div>
        </div>
        <div class="main-content fixed container-fluid">
          <div class="splash-container row">
            <div class="col-12 col-md-6 bulletin-board">
              <div class="must-center text-break markdown-body" th:utext="${_LoginBulletinBoard}"></div>
            </div>
            <div class="col-12 col-md-6 login-form">
              <div><a class="logo-img"></a></div>
              <form id="login-form">
                <div class="form-group">
                  <input class="form-control" id="user" type="text" th:placeholder="${bundle.L('用户名 (或邮箱)')}" />
                </div>
                <div class="form-group position-relative">
                  <input class="form-control" id="passwd" type="password" th:placeholder="${bundle.L('密码')}" autocomplete="off" />
                  <a class="passwd-toggle" tabindex="-1" th:title="${bundle.L('显示密码')}"><i class="zmdi zmdi-eye-off"></i></a>
                </div>
                <div class="form-group row pt-0 mb-3 vcode-row" th:if="${session.needLoginVCode}">
                  <div class="col-6 pr-0">
                    <input class="form-control" type="text" th:placeholder="${bundle.L('验证码')}" />
                  </div>
                  <div class="col-6 text-right pl-0 pr-0">
                    <img class="mw-100" style="margin-right: -15px" src="captcha" th:title="${bundle.L('点击刷新')}" alt="CAPTCHA" />
                  </div>
                </div>
                <div class="form-group row login-tools">
                  <div class="col-6 login-remember">
                    <label class="custom-control custom-checkbox custom-control-inline mb-0">
                      <input class="custom-control-input" type="checkbox" id="autoLogin" />
                      <span class="custom-control-label">[[${bundle.L('记住登录')}]]</span>
                    </label>
                  </div>
                  <div class="col-6 login-forgot-password">
                    <a href="forgot-passwd">[[${bundle.L('找回密码')}]]</a>
                  </div>
                </div>
                <div class="form-group login-submit">
                  <button class="btn btn-primary btn-xl" type="submit" data-spinner>[[${bundle.L('登录')}]]</button>
                  <div class="mt-4 text-center" th:utext="${bundle.L('还没有账号? [立即注册](signup)')}"></div>
                </div>
                <div class="login-with" th:if="${ssoDingtalk != null || ssoWxwork != null || ssoFeishu != null || ssoIdpaas != null}">
                  <span>[[${bundle.L('第三方登录')}]]</span>
                  <a href="login/sso?protocol=dingtalk" th:if="${ssoDingtalk != null}" data-toggle="tooltip" th:title="${bundle.L('钉钉')}" data-url-external="desktop">
                    <img th:src="@{/assets/img/dingtalk256.png}" alt="DingTalk" />
                  </a>
                  <a href="login/sso?protocol=wxwork" th:if="${ssoWxwork != null}" data-toggle="tooltip" th:title="${bundle.L('企业微信')}" data-url-external="desktop">
                    <img th:src="@{/assets/img/wxwork512.png}" alt="WeCom" />
                  </a>
                  <a href="login/sso?protocol=feishu" th:if="${ssoFeishu != null}" data-toggle="tooltip" th:title="${bundle.L('飞书')}" data-url-external="desktop">
                    <img th:src="@{/assets/img/feishu512.png}" alt="Feishu" />
                  </a>
                  <a href="login/sso?protocol=idpaas" th:if="${ssoIdpaas != null}" data-toggle="tooltip" th:title="${bundle.L('SSO 登录')}" data-open-external="ignore">
                    <img th:src="@{/assets/img/icon-sso.png}" alt="SSO" />
                  </a>
                </div>
                <div class="row mt-6 login-meta">
                  <div class="col-8">
                    <div class="btn-group dropup h5-mobile fs-0">
                      <a class="dropdown-toggle" data-toggle="dropdown" th:href="${mobileUrl}" data-url-external="ignore">
                        <i class="icon zmdi zmdi-smartphone-iphone"></i>
                        <span class="up-1">[[${bundle.L('手机版')}]]</span>
                      </a>
                      <div class="dropdown-menu shadow-lg">
                        <div>
                          <img class="w-100" alt="Mobile QR" />
                        </div>
                      </div>
                    </div>
                    <div class="btn-group dropup h5-mobile pwa fs-0 ml-2">
                      <a th:href="${desktopAppUrl}">
                        <i class="icon mdi mdi-monitor-arrow-down fs-14"></i>
                        <span class="up-1">[[${bundle.L('放在桌面')}]]</span>
                      </a>
                    </div>
                  </div>
                  <div class="col-4 text-right pl-0">
                    <div class="btn-group">
                      <a class="select-lang dropdown-toggle" data-toggle="dropdown">
                        <i class="icon zmdi zmdi-globe-alt"></i>
                        <span class="down-1">[[${currentLang}]]</span>
                      </a>
                      <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" th:each="L : ${availableLangs}" th:href="${'?locale=' + L[0]}">[[${L[1]}]]</a>
                      </div>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <div class="splash-footer">
            <div class="copyright link">
              &copy;
              <th:block th:utext="${commercial >= 11 ? appName : bundle.L('[REBUILD](https://getrebuild.com/) 技术支持')}" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:if="${pageFooter != null}" class="page-footer mix-color">[(${pageFooter})]</div>
    <th:block th:replace="~{/_include/footer}" />
    <script th:src="@{/assets/js/feeds/announcement.js}" type="text/babel"></script>
    <script th:src="@{/assets/lib/sha256.min.js}"></script>
    <script th:src="@{/assets/js/login.js}" type="text/babel"></script>
  </body>
</html>
